<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AeroRelay Hub Dashboard</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#0f172a; color:#e2e8f0; margin:0; padding:24px; }
  h1 { font-size:20px; font-weight:600; margin-bottom:4px; }
  .subtitle { color:#94a3b8; font-size:13px; margin-bottom:24px; }
  .steps { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:28px; }
  .step { padding:6px 12px; border-radius:6px; font-size:12px; background:#1e293b; color:#64748b; border:1px solid #334155; }
  .step.active { background:#2563eb; color:white; border-color:#2563eb; }
  .step.done { background:#166534; color:#dcfce7; border-color:#166534; }
  .parcel { display:inline-block; padding:6px 14px; border-radius:20px; background:#7c3aed; color:white; font-size:13px; margin-bottom:28px; }
  .cards { display:flex; gap:20px; flex-wrap:wrap; }
  .card { background:#1e293b; border:1px solid #334155; border-radius:10px; padding:18px; min-width:260px; flex:1; }
  .card h2 { margin:0 0 12px 0; font-size:16px; }
  .row { display:flex; justify-content:space-between; padding:4px 0; font-size:13px; border-bottom:1px solid #334155; }
  .row:last-child { border-bottom:none; }
  .label { color:#94a3b8; }
  .value { font-weight:600; }
  .healthy { color:#4ade80; }
  .unhealthy { color:#f87171; }
  .battery-bar { width:100%; height:8px; background:#334155; border-radius:4px; overflow:hidden; margin-top:6px; }
  .battery-fill { height:100%; background:#4ade80; transition:width 0.3s; }
  .stale { opacity:0.4; }
</style>
</head>
<body>
  <h1>AeroRelay Hub &mdash; Live Dashboard</h1>
  <div class="subtitle" id="lastUpdated">connecting...</div>
  <div class="steps" id="hubSteps"></div>
  <div class="parcel" id="parcelState">Parcel: --</div>
  <div class="cards" id="droneCards"></div>

<script>
const HUB_STEPS = [
  "IDLE", "MISSION_RECEIVED", "ASSIGN_DRONE", "WAIT_FOR_RETURN",
  "TRANSFER_PACKAGE", "ASSIGN_SECOND_DRONE", "WAIT_FOR_DELIVERY", "MISSION_COMPLETE"
];

function renderSteps(currentState) {
  const container = document.getElementById('hubSteps');
  container.innerHTML = '';
  const currentIdx = HUB_STEPS.indexOf(currentState);
  HUB_STEPS.forEach((step, idx) => {
    const div = document.createElement('div');
    div.className = 'step';
    if (idx === currentIdx) div.className += ' active';
    else if (currentIdx >= 0 && idx < currentIdx) div.className += ' done';
    div.textContent = step;
    container.appendChild(div);
  });
}

function renderDrone(drone) {
  const batteryPct = Math.max(0, Math.min(100, drone.battery_percent || 0));
  const healthClass = drone.healthy ? 'healthy' : 'unhealthy';
  const healthText = drone.healthy ? 'OK' : (drone.health_message || 'FAULT');
  return `
    <div class="card">
      <h2>${drone.drone_id || 'unknown'}</h2>
      <div class="row"><span class="label">State</span><span class="value">${drone.state || '--'}</span></div>
      <div class="row"><span class="label">Mission</span><span class="value">${drone.current_mission_id || '--'}</span></div>
      <div class="row"><span class="label">Position (x,y,z)</span><span class="value">${(drone.position||{}).x?.toFixed(1) ?? '--'}, ${(drone.position||{}).y?.toFixed(1) ?? '--'}, ${(drone.position||{}).z?.toFixed(1) ?? '--'}</span></div>
      <div class="row"><span class="label">Health</span><span class="value ${healthClass}">${healthText}</span></div>
      <div class="row"><span class="label">Battery</span><span class="value">${batteryPct.toFixed(0)}%</span></div>
      <div class="battery-bar"><div class="battery-fill" style="width:${batteryPct}%"></div></div>
    </div>
  `;
}

async function poll() {
  try {
    const res = await fetch('/api/state');
    const data = await res.json();
    document.getElementById('lastUpdated').textContent = 'last updated ' + new Date().toLocaleTimeString();
    document.getElementById('lastUpdated').classList.remove('stale');
    renderSteps(data.hub_state || 'IDLE');
    document.getElementById('parcelState').textContent = 'Parcel: ' + (data.parcel_state || '--');
    const dronesHtml = Object.values(data.drones || {}).map(renderDrone).join('');
    document.getElementById('droneCards').innerHTML = dronesHtml || '<p>No drones reporting yet.</p>';
  } catch (e) {
    document.getElementById('lastUpdated').textContent = 'connection lost, retrying...';
    document.getElementById('lastUpdated').classList.add('stale');
  }
}

poll();
setInterval(poll, 1000);
</script>
</body>
</html>
